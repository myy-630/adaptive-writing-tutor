[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-writing-tutor"
version = "0.1.0"
description = "Stateful adaptive English writing tutor"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "SQLAlchemy>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "networkx>=3.4,<4",
  "fastembed>=0.6,<1",
  "rank-bm25>=0.2.2,<1",
  "certifi>=2025.1",
  "openai>=2,<3",
  "langgraph>=1,<2",
  "langgraph-checkpoint-postgres>=3,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.11,<1", "mypy>=1.15,<2"]

[tool.setuptools.packages.find]
where = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
